<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png">
        <link rel="manifest" href="./assets/favicon/site.webmanifest">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
        <link href="styles.css" rel="stylesheet" type="text/css">

        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="functions.js"></script>
        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script> -->
        <title>Memory Game by cpenna</title>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row main">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <button type="button" class="btn btn-primary" onclick="computerSequence()" alt="Iniciar jogo">Iniciar</button>
                    <button type="button" class="btn btn-secondary" onclick="cleanup()" alt="Reiniciar jogo">Reiniciar</button>
                    <span id="points"></span>
                </div>
            </div>
            <div class="row main">
                <div class="col">
                    <span class="badge bg-warning" id="strokesLeft"></span>
                </div>
            </div>
            <div class="row main">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <img src="./assets/cavalier.jpg" class="rounded-circle" id="1" onclick="userSequence(id)">
                    <img src="./assets/dachshund.jpg" class="rounded-circle" id="2" onclick="userSequence(id)">
                </div>
            </div>
            <div class="row main">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <img src="./assets/dalmatian.jpg" class="rounded-circle" id="3" onclick="userSequence(id)">
                    <img src="./assets/german-shepherd.jpg" class="rounded-circle" id="4" onclick="userSequence(id)">
                </div>
            </div>
            <div class="row main">
                <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
                    <img src="./assets/golden-retriever.jpg" class="rounded-circle" id="5" onclick="userSequence(id)">
                    <img src="./assets/pug.jpg" class="rounded-circle" id="6" onclick="userSequence(id)">
                </div>
            </div>
        </div>
    </body>
</html>
